[project]
name = "steeramed-bench"
version = "0.1.0"
description = "SteeraMed Bench: module-panel evaluation benchmark for drug repurposing in aging."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "DeepoMe", email = "contact@deepome.com"},
]
keywords = ["drug-repurposing", "aging", "network-proximity", "benchmark", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://steeramed.com"
Repository = "https://github.com/DeepoMe/SteeraMed-bench"
Paper = "https://doi.org/10.20944/preprints202608.0998.v1"
Demo = "https://steeramed.com/bench"
Issues = "https://github.com/DeepoMe/SteeraMed-bench/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["steeramed_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
